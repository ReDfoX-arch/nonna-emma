backend:
  name: github
  repo: ReDfoX-arch/nonna-emma
  branch: main
  base_url: https://auth.nonna-emma-admin.workers.dev
  auth_endpoint: auth

site_url: https://redfox-arch.github.io/nonna-emma/
display_url: https://redfox-arch.github.io/nonna-emma/
publish_mode: simple
locale: it

editor:
  preview: false

logo:
  src: ../images/brand/logo.png
  show_in_header: true

media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: catalogo
    label: Catalogo del sito
    files:
      - name: catalogo
        label: Categorie e progetti
        file: content/catalogo.json
        fields:
          - label: "Tema di sfondo del sito"
            name: tema_sfondo
            widget: select
            required: false
            default: "sfumatura-crema"
            options:
              - { label: "Sfumatura Crema Delicata (Standard con trasparenza)", value: "sfumatura-crema" }
              - { label: "Sfumatura Pesca e Salvia (Morbida e pastello)", value: "sfumatura-pesca" }
              - { label: "Sfumatura Neutra Elegante (Lino chiaro)", value: "sfumatura-neutra" }
              - { label: "Trama Lino e Cotone (Texture artigianale)", value: "trama-lino" }
            hint: "Scegli l'atmosfera e il gradiente di sfondo visibile in tutte le pagine del sito."
          - label: Suggerimenti per i tag
            name: suggerimenti_tag
            widget: list
            required: false
            collapsed: true
            label_singular: Aggiungi suggerimento
            field:
              label: Tag suggerito
              name: tag
              widget: string
              required: true
            hint: "Aggiungi i tag da proporre nei campi; elimina una voce per rimuoverla dai suggerimenti."
          - label: Categorie
            name: categorie
            widget: list
            summary: "{{fields.nome}}"
            collapsed: true
            min: 1
            label_singular: Aggiungi categoria
            fields:
              - label: Identificativo (URL)
                name: id
                widget: string
                hint: "Univoco in tutto il catalogo, minuscolo e senza spazi (es. decorazioni). Non cambiarlo dopo la pubblicazione."
                pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Usa lettere minuscole, numeri e trattini.']
              - label: Nome categoria
                name: nome
                widget: string
              - label: Descrizione
                name: descrizione
                widget: text
              - label: Tag generali della categoria
                name: tag_generali
                widget: list
                required: false
                label_singular: Aggiungi tag generale
                field:
                  label: Tag generale
                  name: tag
                  widget: string
                  required: true
                hint: "Questi tag vengono applicati automaticamente a tutti i progetti e alle relative foto della categoria."
              - label: Progetti
                name: elementi
                widget: list
                summary: "{{fields.nome}}"
                collapsed: true
                min: 1
                label_singular: Aggiungi progetto
                fields:
                  - label: Identificativo (URL)
                    name: id
                    widget: string
                    hint: "Univoco in tutto il catalogo, minuscolo e senza spazi (es. cestino-uncinetto). Non cambiarlo dopo la pubblicazione."
                    pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Usa lettere minuscole, numeri e trattini.']
                  - label: Nome progetto
                    name: nome
                    widget: string
                  - label: Descrizione
                    name: descrizione
                    widget: text
                  - label: Foto del progetto
                    name: immagini
                    widget: list
                    min: 1
                    summary: "{{fields.percorso}}"
                    collapsed: true
                    label_singular: Aggiungi foto
                    fields:
                      - label: Foto
                        name: percorso
                        widget: image
                      - label: Parole chiave
                        name: tag
                        widget: list
                        required: false
                        label_singular: Aggiungi parola chiave
                        field:
                          label: Parola chiave
                          name: parola
                          widget: string
                          required: true
                        hint: "Riutilizza i suggerimenti per mantenere le parole coerenti; il sito uniforma le maiuscole."
                    hint: Aggiungi una foto per volta; usa l'ordine desiderato nella galleria.
                  - label: Pagina speciale
                    name: pagina
                    widget: string
                    required: false
                    hint: "Lascia vuoto per la galleria standard. Usa prodotto.html solo per le calzine."
                    pattern: ['^prodotto\.html$', 'Lascia vuoto oppure inserisci prodotto.html.']
